name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build both kernels and run the PC tests (make test-host).
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu picolibc-aarch64-linux-gnu \
            qemu-system-arm make python3 python3-numpy python3-pil dosfstools mtools

      - name: Build the Pi Zero W kernel
        run: make -j"$(nproc)"

      - name: Build the RGB30 kernel
        run: make TARGET=rgb30 -j"$(nproc)"

      - name: Tests on the PC
        run: make test-host

  # The Pi kernel in QEMU (tests/qemu_test.py), split in four groups.
  qemu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi \
            qemu-system-arm make python3 python3-numpy python3-pil dosfstools mtools

      - name: Build
        run: make -j"$(nproc)"

      - name: QEMU tests
        run: make test-qemu SHARD=${{ matrix.shard }}/4

  # The RGB30 kernel on QEMU's virt machine.
  rgb30:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu picolibc-aarch64-linux-gnu \
            qemu-system-arm make python3 dosfstools mtools

      - name: Build
        run: make TARGET=rgb30 -j"$(nproc)"

      - name: QEMU tests
        run: make TARGET=rgb30 test
